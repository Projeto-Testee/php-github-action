version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - php
    groups:
      laravel-packages:
        patterns:
          - "laravel/*"
      testing-tools:
        patterns:
          - "phpunit/*"
          - "mockery/*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions