name: Pipeline Laravel CI
run-name: Pipeline CI executada por ${{github.actor}} em ${{github.run_number}}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: laravel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # build: compila uma única vez e publica artefato imutável
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: >
            bcmath,
            ctype,
            fileinfo,
            json,
            mbstring,
            openssl,
            pdo_mysql,
            tokenizer,
            xml
          coverage: none
          tools: composer:v2

      - name: Configure Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate required files
        run: bash .github/scripts/validate-build.sh

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install PHP dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --optimize-autoloader

      - name: Install frontend dependencies
        run: npm ci

      - name: Compile frontend assets
        run: npm run production

      - name: Verify build outputs
        run: |
          set -euo pipefail
          test -d vendor                    || { echo "::error::vendor/ not found"; exit 1; }
          test -f public/js/app.js          || { echo "::error::public/js/app.js not found"; exit 1; }
          test -f public/mix-manifest.json  || { echo "::error::public/mix-manifest.json not found"; exit 1; }

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-ci-build-${{ github.sha }}
          include-hidden-files: true
          # node_modules e .env excluídos — binários PHP estão em vendor/
          path: |
            .
            !.git
            !.env
            !node_modules
            !storage/logs
            !reports
          retention-days: 3


  # ──────────────────────────────────────────────────────────────────────────
  # unit-tests: testes isolados, sem banco de dados
  # ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Configure PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: >
            bcmath,
            ctype,
            fileinfo,
            json,
            mbstring,
            openssl,
            pdo_mysql,
            tokenizer,
            xml
          coverage: none
          tools: composer:v2

      - name: Download CI artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel-ci-build-${{ github.sha }}

      - name: Create required directories
        run: |
          mkdir -p reports
          mkdir -p tests/Unit

      - name: Prepare Laravel environment
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i "s|^APP_ENV=.*|APP_ENV=testing|"             .env
          sed -i "s|^APP_DEBUG=.*|APP_DEBUG=false|"           .env
          sed -i "s|^LOG_CHANNEL=.*|LOG_CHANNEL=stderr|"      .env
          sed -i "s|^CACHE_DRIVER=.*|CACHE_DRIVER=array|"     .env
          sed -i "s|^SESSION_DRIVER=.*|SESSION_DRIVER=array|" .env
          sed -i "s|^MAIL_MAILER=.*|MAIL_MAILER=array|"       .env
          php artisan key:generate

      - name: Run unit tests
        run: |
          php vendor/bin/phpunit \
            --testsuite=Unit \
            --log-junit=reports/unit-junit.xml

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ github.sha }}
          path: reports/unit-junit.xml
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # integration-tests: testes de feature com banco MySQL isolado
  # ──────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Configure PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: >
            bcmath,
            ctype,
            fileinfo,
            json,
            mbstring,
            openssl,
            pdo_mysql,
            tokenizer,
            xml
          coverage: none
          tools: composer:v2

      - name: Download CI artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel-ci-build-${{ github.sha }}

      - name: Prepare Laravel environment
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i "s|^APP_ENV=.*|APP_ENV=testing|"             .env
          sed -i "s|^APP_DEBUG=.*|APP_DEBUG=false|"           .env
          sed -i "s|^LOG_CHANNEL=.*|LOG_CHANNEL=stderr|"      .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=laravel_test|" .env
          sed -i "s|^CACHE_DRIVER=.*|CACHE_DRIVER=array|"     .env
          sed -i "s|^SESSION_DRIVER=.*|SESSION_DRIVER=array|" .env
          sed -i "s|^MAIL_MAILER=.*|MAIL_MAILER=array|"       .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Clear Laravel caches
        run: |
          php artisan config:clear
          php artisan cache:clear

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run integration tests
        run: |
          php vendor/bin/phpunit \
            --testsuite=Feature \
            --log-junit=reports/integration-junit.xml

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report-${{ github.sha }}
          path: reports/integration-junit.xml
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # static-analysis: PHPStan level 1 com Larastan
  # ──────────────────────────────────────────────────────────────────────────
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Configure PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: >
            bcmath,
            ctype,
            fileinfo,
            json,
            mbstring,
            openssl,
            tokenizer,
            xml
          coverage: none
          tools: composer:v2

      - name: Download CI artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel-ci-build-${{ github.sha }}

      - name: Prepare Laravel cache/view paths
        run: |
          set -euo pipefail
          mkdir -p storage/framework/views
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p bootstrap/cache

      - name: Run PHPStan
        env:
          VIEW_COMPILED_PATH: storage/framework/views
        run: |
          php vendor/bin/phpstan analyse \
            --configuration=phpstan.neon \
            --error-format=github \
            --no-progress \
            --memory-limit=1G


  # ──────────────────────────────────────────────────────────────────────────
  # package: cria o pacote de entrega somente após todos os gates aprovados
  #          Executa apenas em push para main (não em pull requests)
  # ──────────────────────────────────────────────────────────────────────────
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-tests, integration-tests, static-analysis]
    if: github.event_name != 'pull_request'

    steps:
      - name: Download CI artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel-ci-build-${{ github.sha }}
          path: build/

      - name: Remove dev-only files from release
        run: |
          set -euo pipefail
          rm -rf \
            build/tests \
            build/reports \
            build/.github \
            build/node_modules \
            build/storage/logs \
            build/phpstan.neon \
            build/.env.example \
            build/webpack.mix.js \
            build/package.json \
            build/package-lock.json \
            build/server.php

      - name: Create release tarball
        run: tar -czf laravel-release-${{ github.sha }}.tar.gz -C build .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-release-${{ github.sha }}
          path: laravel-release-${{ github.sha }}.tar.gz
          retention-days: 30